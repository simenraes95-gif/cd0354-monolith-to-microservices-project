dist: focal
language: minimal

services:
  - docker

env:
  global:
    - IMAGE_TAG=v${TRAVIS_BUILD_NUMBER}

# DOCKER_USERNAME and DOCKER_PASSWORD must be set as encrypted environment
# variables in the Travis repository settings (Settings > Environment Variables).
# Do not commit them here.
before_install:
  - if [ "$TRAVIS_PULL_REQUEST" = "false" ]; then echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin; fi

script:
  - docker build -t udagram-api-feed ./udagram-api-feed
  - docker build -t udagram-api-user ./udagram-api-user
  - docker build -t udagram-frontend ./udagram-frontend
  - docker build -t reverseproxy ./udagram-reverseproxy

# Push a build-unique tag (so images are never stale/dangling) plus "latest"
# for convenience. Skipped on PR builds since forked PRs don't get secrets.
after_success:
  - |
    if [ "$TRAVIS_PULL_REQUEST" = "false" ]; then
      for repo in udagram-api-feed udagram-api-user udagram-frontend reverseproxy; do
        docker tag "$repo" "$DOCKER_USERNAME/$repo:$IMAGE_TAG"
        docker tag "$repo" "$DOCKER_USERNAME/$repo:latest"
        docker push "$DOCKER_USERNAME/$repo:$IMAGE_TAG"
        docker push "$DOCKER_USERNAME/$repo:latest"
      done
    fi

branches:
  only:
    - main
